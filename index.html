<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Для моей любимой ❤️</title>
  <style>
    :root {
      --bg: #1a0b2e;
      --card-bg: rgba(45, 20, 60, 0.88);
      --text: #fff1f2;
      --text-muted: #fda4af;
      --accent: #fb7185;
      --accent-active: #e11d48;
      --success: #22c55e;
      --danger: #ef4444;
      --border: rgba(255, 182, 193, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #3b0764, #1f082e, #0f0318);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 24px 20px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.55), 0 0 30px rgba(251, 113, 133, 0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.4s ease-in-out;
    }

    .tag {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-align: center;
    }

    .timer-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
      display: none;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
      transition: width 1s linear;
    }

    .image-box {
      width: 100%;
      height: 220px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.3);
      display: none;
      border: 1px solid var(--border);
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .text-title {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hint {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      margin-top: -8px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.2s, transform 0.1s, border-color 0.2s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-correct {
      background: var(--success) !important;
      border-color: var(--success) !important;
      color: #fff !important;
    }

    .btn-wrong {
      background: var(--danger) !important;
      border-color: var(--danger) !important;
      color: #fff !important;
    }

    .btn-accent {
      background: linear-gradient(135deg, #fb7185, #e11d48);
      color: #fff;
      font-weight: 700;
      border: none;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
    }

    .btn-accent:active {
      background: #be123c;
    }

    .input-field {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      color: #fff;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
      text-align: center;
      -webkit-user-select: text;
      user-select: text;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    /* Сетка цветов 3x3 */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
    }

    .color-box {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.12s ease;
    }

    .color-box:active {
      transform: scale(0.92);
    }

    /* Ползунок */
    .slider-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 12px 0;
    }

    .slider-val {
      font-size: 44px;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(251, 113, 133, 0.5);
    }

    .range-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }

    .range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(251, 113, 133, 0.8);
    }

    /* Убегающая кнопка */
    .run-area {
      width: 100%;
      height: 190px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-run-yes {
      padding: 15px 36px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 16px;
      background: linear-gradient(135deg, #fb7185, #e11d48);
      color: #fff;
      border: none;
      z-index: 1;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
    }

    .btn-run-no {
      padding: 15px 36px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid var(--border);
      position: absolute;
      transition: top 0.15s ease, left 0.15s ease;
      z-index: 10;
      touch-action: none;
    }

    /* Сетка спорта 3x3 */
    .sports-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 290px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
    }

    .sport-btn {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.12s ease, background 0.2s, border-color 0.2s;
    }

    .sport-btn:active {
      transform: scale(0.92);
    }

    .sport-icon {
      font-size: 32px;
      line-height: 1;
    }

    .sport-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Сетка для частей тела 2x3 */
    .body-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
    }

    /* PIN код */
    .dots-container {
      display: flex;
      gap: 16px;
      margin: 6px 0;
      justify-content: center;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .dot.active {
      background-color: var(--accent);
      border-color: var(--accent);
      transform: scale(1.2);
    }

    .dot.error {
      background-color: var(--danger);
      border-color: var(--danger);
    }

    .dot.success {
      background-color: var(--success);
      border-color: var(--success);
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 18px;
      width: 100%;
      max-width: 270px;
      margin: 0 auto;
    }

    .num-btn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 24px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .num-btn:active {
      background-color: rgba(255, 255, 255, 0.25);
      transform: scale(0.92);
    }

    .btn-empty {
      visibility: hidden;
    }

    .btn-delete {
      font-size: 13px;
      font-weight: 600;
      background: transparent;
      border: none;
      color: var(--text-muted);
    }

    /* Конверт и печати */
    .envelope-box {
      width: 100%;
      height: 200px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed var(--accent);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      touch-action: manipulation;
      position: relative;
      transition: transform 0.1s ease;
    }

    .envelope-box:active {
      transform: scale(0.96);
    }

    .seal-icon {
      font-size: 50px;
      transition: transform 0.15s ease;
    }

    .clicks-left {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
    }

    /* Большое сердечко в финале */
    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.18); }
      28% { transform: scale(1); }
      42% { transform: scale(1.18); }
      70% { transform: scale(1); }
    }

    .big-heart {
      font-size: 90px;
      text-align: center;
      animation: heartbeat 1.4s infinite ease-in-out;
      margin: 10px 0;
      filter: drop-shadow(0 0 25px rgba(244, 63, 94, 0.7));
    }

    /* Модалка */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 99;
    }

    .modal-card {
      width: 100%;
      max-width: 320px;
      background: #250e38;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      animation: fadeIn 0.2s ease-out;
    }

    .modal-img {
      width: 130px;
      height: 130px;
      border-radius: 14px;
      object-fit: cover;
      display: none;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="container" id="main-container">
    <div class="tag" id="step-tag">Загрузка</div>
    
    <div class="timer-bar" id="timer-bar">
      <div class="timer-fill" id="timer-fill"></div>
    </div>

    <div class="image-box" id="img-box">
      <img id="step-img" src="" alt="Иллюстрация">
    </div>

    <div class="text-title" id="text-container"></div>
    <div class="hint" id="hint-container" style="display: none;"></div>
    <div class="options" id="controls-container"></div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <img id="modal-img" class="modal-img" src="" alt="Иллюстрация">
      <div class="modal-title" id="modal-text"></div>
      <button class="btn btn-accent" id="modal-btn">Понятно</button>
    </div>
  </div>

  <script>
    let timerInterval = null;
    let timeLeft = 7;
    const FAIL_IMG = "https://i.postimg.cc/fb26HYKn/photo-1.jpg";

    function showModal(text, imgSrc, onClose) {
      const modal = document.getElementById("modal");
      const modalText = document.getElementById("modal-text");
      const modalImg = document.getElementById("modal-img");
      const modalBtn = document.getElementById("modal-btn");

      modalText.innerText = text;

      if (imgSrc) {
        modalImg.src = imgSrc;
        modalImg.style.display = "block";
      } else {
        modalImg.style.display = "none";
      }

      modal.style.display = "flex";

      modalBtn.onclick = () => {
        modal.style.display = "none";
        if (onClose) onClose();
      };
    }

    function resetTimer() {
      clearInterval(timerInterval);
      document.getElementById("timer-bar").style.display = "none";
    }

    function triggerShake() {
      const c = document.getElementById("main-container");
      c.classList.remove("shake");
      void c.offsetWidth;
      c.classList.add("shake");
    }

    function hideHint() {
      const hint = document.getElementById("hint-container");
      hint.style.display = "none";
      hint.innerText = "";
    }

    // --- 1. Вопрос 1: Имя ---
    function step1() {
      resetTimer();
      hideHint();
      document.getElementById("step-tag").innerText = "Вопрос 1";
      document.getElementById("img-box").style.display = "none";
      document.getElementById("text-container").innerText = "Как тебя зовут бебе?";

      const controls = document.getElementById("controls-container");
      controls.innerHTML = `
        <input type="text" id="name-input" class="input-field" placeholder="Напиши имя..." autocomplete="off">
        <button class="btn btn-accent" id="submit-name">Ответить</button>
      `;

      document.getElementById("submit-name").onclick = () => {
        const val = document.getElementById("name-input").value.trim().toLowerCase();
        if (val === "маша" || val === "мария") {
          step2();
        } else {
          triggerShake();
          showModal("ЗАБЫЛА КАК ЗОВУТ??????", FAIL_IMG, null);
        }
      };
    }

    // --- 2. Вопрос 2: Дата с таймером 7 сек ---
    function step2() {
      resetTimer();
      hideHint();
      document.getElementById("step-tag").innerText = "Вопрос 2";
      document.getElementById("img-box").style.display = "none";
      document.getElementById("text-container").innerText = "Какого числа мы первый раз написали друг другу?";

      const timerBar = document.getElementById("timer-bar");
      const timerFill = document.getElementById("timer-fill");
      timerBar.style.display = "block";

      timeLeft = 7;
      timerFill.style.width = "100%";

      const controls = document.getElementById("controls-container");
      controls.innerHTML = `
        <button class="btn" onclick="handleStep2Click(this, false)">7 мая 2022</button>
        <button class="btn" onclick="handleStep2Click(this, true)">15 марта 2022</button>
        <button class="btn" onclick="handleStep2Click(this, false)">14 апреля 2023</button>
        <button class="btn" onclick="handleStep2Click(this, false)">14 марта 2022</button>
      `;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerFill.style.width = (timeLeft / 7 * 100) + "%";
        if (timeLeft <= 0) {
          resetTimer();
          triggerShake();
          showModal("Время вышло!", FAIL_IMG, () => step2());
        }
      }, 1000);
    }

    function handleStep2Click(buttonEl, isCorrect) {
      resetTimer();
      const allBtns = document.querySelectorAll("#controls-container .btn");
      allBtns.forEach(btn => btn.style.pointerEvents = "none");

      if (isCorrect) {
        buttonEl.classList.add("btn-correct");
        setTimeout(() => {
          stepTransition();
        }, 800);
      } else {
        buttonEl.classList.add("btn-wrong");
        triggerShake();
        setTimeout(() => {
          showModal("Неверная дата!", FAIL_IMG, () => step2());
        }, 600);
      }
    }

    // --- Переходный экран ---
    function stepTransition() {
      resetTimer();
      hideHint();
      document.getElementById("step-tag").innerText = "Новый раздел";
      document.getElementById("img-box").style.display = "none";
      document.getElementById("text-container").innerText = "Теперь будет блок заданий связанный с моими увлечениями, вкусами и пр.";

      const controls = document.getElementById("controls-container");
      controls.innerHTML = `
        <button class="btn btn-accent" onclick="step3_input()">Далее</button>
      `;
    }

    // --- 3. Фото персонажа (Ввод текста) ---
    function step3_input() {
      resetTimer();
      hideHint();
      document.getElementById("step-tag").innerText = "Задание 1";
      
      const imgBox = document.getElementById("img-box");
      const img = document.getElementById("step-img");
      img.src = "https://i.postimg.cc/nLR6dq15/photo-2.png";
      imgBox.style.display = "block";

      document.getElementById("text-container").innerText = "Кто изображен на фото?";

      const controls = document.getElementById("controls-container");
      controls.innerHTML = `
        <input type="text" id="hero-input" class="input-field" placeholder="Введи имя персонажа..." autocomplete="off">
        <button class="btn btn-accent" id="submit-hero">Ответить</button>
      `;

      document.getElementById("submit-hero").onclick = () => {
        const val = document.getElementById("hero-input").value.trim().toLowerCase();
        if (val === "виндикта" || val === "vindicta") {
          step4_colors();
        } else {
          triggerShake();
          step3_options();
        }
      };
    }

    // --- 3.1 Попытка 2 (Выбор) ---
    function step3_options() {
      document.getElementById("step-tag").innerText = "Попытка 2";
      document.getElementById("text-container").innerText = "Ладно, чуть полегче:";

      const controls = document.getElementById("controls-container");
      controls.innerHTML = `
        <button class="btn" onclick="handleStep3Choice(this, false)">а) Мина</button>
        <button class="btn" onclick="handleStep3Choice(this, true)">б) Виндикта</button>
        <button class="btn" onclick="handleStep3Choice(this, false)">в) МакГиннис</button>
        <button class="btn" onclick="handleStep3Choice(this, false)">г) Человек Паук</button>
      `;
    }

    function handleStep3Choice(buttonEl, isCorrect) {
      const allBtns = document.querySelectorAll("#controls-container .btn");
      allBtns.forEach(btn => btn.style.pointerEvents = "none");

      if (isCorrect) {
        buttonEl.classList.add("btn-correct");
        setTimeout(() => {
          step4_colors();
        }, 700);
      } else {
        buttonEl.classList.add("btn-wrong");
        triggerShake();
        setTimeout(() => {
          showModal("Не угадала!", FAIL_IMG, () => {
            step4_colors();
          });
        }, 500);
      }
    }

    // --- 4. Выбор цвета (Желтый) ---
    function step4_colors() {
      resetTimer();
      hideHint();
      document.getElementById("step-tag").innerText = "Задание 2";
      document.getElementById("img-box").style.display = "none";
      document.getElementById("text-container").innerText = "Выбери правильный цвет:";

      const colors = [
        { id: "red", hex: "#ef4444", correct: false },
        { id: "blue", hex: "#3b82f6", correct: false },
        { id: "green", hex: "#22c55e", correct: false },
        { id: "yellow", hex: "#eab308", correct: true }, // ЖЕЛТЫЙ
        { id: "black", hex: "#000000", correct: false },
        { id: "purple", hex: "#a855f7", correct: false },
        { id: "orange", hex: "#f97316", correct: false },
        { id: "pink", hex: "#ec4899", correct: false },
        { id: "white", hex: "#ffffff", correct: false }
      ];

      const controls = document.getElementById("controls-container");
      controls.innerHTML = `<div class="color-grid" id="grid"></div>`;
      
      const grid = document.getElementById("grid");
      colors.forEach(item => {
        const box = document.createElement("div");
        box.className = "color-box";
        box.style.backgroundColor = item.hex;
        if (item.id === "white") box.style.borderColor = "rgba(255, 255, 255, 0.4)";

        box.onclick = () => {
          if (item.correct) {
            box.style.borderColor = "var(--success)";
            box.style.transform = "scale(1.08)";
            setTimeout(() => step5_slider(), 500);
          } else {
            triggerShake();
            setTimeout(() => step4_colors(), 400);
          }
        };
        grid.appendChild(box);
      });
    }

    // --- 5. Ползунок (100) ---
    function step5_slider() {
      resetTimer();
      hideHint();
      document.getElementById("step-tag").innerText = "Задание 3";
      document.getElementById("img-box").style.display = "none";
      document.getElementById("text-container").innerText = "Насколько сильно любишь?";

      const controls = document.getElementById("controls-container");
      controls.innerHTML = `
        <div class="slider-wrapper">
          <div class="slider-val" id="val-display">50</div>
          <input type="range" min="1" max="100" value="50" class="range-input" id="love-slider">
        </div>
        <button class="btn btn-accent" id="submit-slider">Ответить</button>
      `;

      const slider = document.getElementById("love-slider");
      const display = document.getElementById("val-display");

      slider.oninput = () => {
        display.innerText = slider.value;
      };

      document.getElementById("submit-slider").onclick = () => {
        if (parseInt(slider.value, 10) === 100) {
          step6_runaway();
        } else {
          triggerShake();
          showModal("Даю шанс исправиться!", null, () => step5_slider());
        }
      };
    }

    // --- 6. Убегающая кнопка ---
    function step6_runaway() {
      resetTimer();
      hideHint();
      document.getElementById("step-tag").innerText = "Очень важный вопрос";
      document.getElementById("img-box").style.display = "none";
      document.getElementById("text-container").innerText = "Анал?";

      const controls = document.getElementById("controls-container");
      controls.innerHTML = `
        <div class="run-area" id="run-area">
          <button class="btn-run-yes" id="btn-run-yes">Да</button>
          <button class="btn-run-no" id="btn-run-no">Нет</button>
        </div>
      `;

      const btnNo = document.getElementById('btn-run-no');
      const btnYes = document.getElementById('btn-run-yes');
      const area = document.getElementById('run-area');

      btnNo.style.top = '68px';
      btnNo.style.left = '200px';

      function moveNo(e) {
        if (e && e.cancelable) e.preventDefault();
        const areaRect = area.getBoundingClientRect();
        const btnRect = btnNo.getBoundingClientRect();
        const maxX = Math.max(0, areaRect.width - btnRect.width);
        const maxY = Math.max(0, areaRect.height - btnRect.height);

        const randomX = Math.floor(Math.random() * maxX);
        const randomY = Math.floor(Math.random() * maxY);

        btnNo.style.left = `${randomX}px`;
        btnNo.style.top = `${randomY}px`;
      }

      btnNo.addEventListener('touchstart', moveNo, { passive: false });
      btnNo.addEventListener('mouseover', moveNo);
      btnNo.addEventListener('click', moveNo);

      btnYes.onclick = () => {
        step7_sport();
      };
    }

    // --- 7. Любимый спорт ---
    function step7_sport() {
      resetTimer();
      hideHint();
      document.getElementById("step-tag").innerText = "Задание 4";
      document.getElementById("img-box").style.display = "none";
      document.getElementById("text-container").innerText = "Мой любимый вид спорта:";

      const sports = [
        { id: "basket", name: "Баскетбол", icon: "🏀", correct: false },
        { id: "football", name: "Футбол", icon: "⚽", correct: true },
        { id: "tennis", name: "Теннис", icon: "🎾", correct: false },
        { id: "box", name: "Бокс", icon: "🥊", correct: false },
        { id: "hockey", name: "Хоккей", icon: "🏒", correct: false },
        { id: "f1", name: "Гонки", icon: "🏎️", correct: false },
        { id: "volley", name: "Волейбол", icon: "🏐", correct: false },
        { id: "swim", name: "Плавание", icon: "🏊‍♂️", correct: false },
        { id: "chess", name: "Шахматы", icon: "♟️", correct: false }
      ];

      const controls = document.getElementById("controls-container");
      controls.innerHTML = `<div class="sports-grid" id="sports-grid"></div>`;
      const grid = document.getElementById("sports-grid");

      sports.forEach(item => {
        const btn = document.createElement("div");
        btn.className = "sport-btn";
        btn.innerHTML = `
          <span class="sport-icon">${item.icon}</span>
          <span class="sport-name">${item.name}</span>
        `;

        btn.onclick = () => {
          const all = document.querySelectorAll(".sport-btn");
          all.forEach(b => b.style.pointerEvents = "none");

          if (item.correct) {
            btn.classList.add("btn-correct");
            setTimeout(() => step8_body(), 600);
          } else {
            btn.classList.add("btn-wrong");
            triggerShake();
            setTimeout(() => step7_sport(), 600);
          }
        };
        grid.appendChild(btn);
      });
    }

    // --- 8. Любимая часть тела ---
    function step8_body() {
      resetTimer();
      hideHint();
      document.getElementById("step-tag").innerText = "Задание 5";
      document.getElementById("img-box").style.display = "none";
      document.getElementById("text-container").innerText = "Любимая часть твоего тела:";

      const bodyParts = [
        { name: "Попка 🍑", correct: true },
        { name: "Котик 🐱", correct: false },
        { name: "Губки 💋", correct: false },
        { name: "Ножки 🦵", correct: false },
        { name: "Ручки 🤲", correct: false },
        { name: "Шея ✨", correct: false }
      ];

      const controls = document.getElementById("controls-container");
      controls.innerHTML = `<div class="body-grid" id="body-grid"></div>`;
      const grid = document.getElementById("body-grid");

      bodyParts.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = item.name;

        btn.onclick = () => {
          const all = document.querySelectorAll("#body-grid .btn");
          all.forEach(b => b.style.pointerEvents = "none");

          if (item.correct) {
            btn.classList.add("btn-correct");
            setTimeout(() => step9_pin(), 800);
          } else {
            btn.classList.add("btn-wrong");
            triggerShake();
            setTimeout(() => step8_body(), 600);
          }
        };
        grid.appendChild(btn);
      });
    }

    // --- 9. Загадка с PIN-кодом (0704) ---
    let currentPin = "";
    let isPinLocked = false;

    function step9_pin() {
      resetTimer();
      currentPin = "";
      isPinLocked = false;

      document.getElementById("step-tag").innerText = "Задание 6";
      document.getElementById("img-box").style.display = "none";
      document.getElementById("text-container").innerText = "Введи 4 цифры, чтобы открыть следующий уровень";
      
      const hint = document.getElementById("hint-container");
      hint.innerText = "Подсказка: лучший день в твоей жизни";
      hint.style.display = "block";

      const controls = document.getElementById("controls-container");
      controls.innerHTML = `
        <div class="dots-container" id="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="numpad">
          <button class="num-btn" onclick="pressPin('1')">1</button>
          <button class="num-btn" onclick="pressPin('2')">2</button>
          <button class="num-btn" onclick="pressPin('3')">3</button>
          <button class="num-btn" onclick="pressPin('4')">4</button>
          <button class="num-btn" onclick="pressPin('5')">5</button>
          <button class="num-btn" onclick="pressPin('6')">6</button>
          <button class="num-btn" onclick="pressPin('7')">7</button>
          <button class="num-btn" onclick="pressPin('8')">8</button>
          <button class="num-btn" onclick="pressPin('9')">9</button>
          <div class="num-btn btn-empty"></div>
          <button class="num-btn" onclick="pressPin('0')">0</button>
          <button class="num-btn btn-delete" onclick="deletePin()">Удалить</button>
        </div>
      `;
    }

    function updatePinDots() {
      const dots = document.querySelectorAll('#dots .dot');
      dots.forEach((dot, index) => {
        if (index < currentPin.length) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active', 'error', 'success');
        }
      });
    }

    function pressPin(digit) {
      if (isPinLocked || currentPin.length >= 4) return;
      currentPin += digit;
      updatePinDots();

      if (currentPin.length === 4) {
        checkPinCode();
      }
    }

    function deletePin() {
      if (isPinLocked || currentPin.length === 0) return;
      currentPin = currentPin.slice(0, -1);
      updatePinDots();
    }

    function checkPinCode() {
      isPinLocked = true;
      const dots = document.querySelectorAll('#dots .dot');

      if (currentPin === "0704") {
        dots.forEach(dot => {
          dot.classList.remove('active');
          dot.classList.add('success');
        });
        setTimeout(() => {
          step10_envelope();
        }, 500);
      } else {
        dots.forEach(dot => {
          dot.classList.remove('active');
          dot.classList.add('error');
        });
        triggerShake();
        setTimeout(() => {
          currentPin = "";
          updatePinDots();
          isPinLocked = false;
        }, 700);
      }
    }

    // --- 10. Конверт (10 кликов) ---
    let envelopeClicks = 0;

    function step10_envelope() {
      resetTimer();
      hideHint();
      envelopeClicks = 0;

      document.getElementById("step-tag").innerText = "Секретное послание 💌";
      document.getElementById("img-box").style.display = "none";
      document.getElementById("text-container").innerText = "Тебе пришло тайное послание. Нажми 10 раз на конверт, чтобы сорвать печати!";

      const controls = document.getElementById("controls-container");
      controls.innerHTML = `
        <div class="envelope-box" id="envelope-btn">
          <div class="seal-icon" id="seal">💌</div>
          <div class="clicks-left" id="clicks-left">Осталось нажать: 10</div>
        </div>
      `;

      const envelopeBtn = document.getElementById("envelope-btn");
      const seal = document.getElementById("seal");
      const clicksLeft = document.getElementById("clicks-left");

      const sealIcons = ["💌", "🔒", "🔐", "🔓", "✨", "💖", "🔥", "💥", "💫", "❤️"];

      envelopeBtn.onclick = () => {
        envelopeClicks++;
        const remaining = 10 - envelopeClicks;

        seal.style.transform = `scale(${1 + envelopeClicks * 0.04}) rotate(${envelopeClicks % 2 === 0 ? 8 : -8}deg)`;
        seal.innerText = sealIcons[envelopeClicks - 1] || "❤️";

        if (remaining > 0) {
          clicksLeft.innerText = `Осталось нажать: ${remaining}`;
        } else {
          finishSuccess();
        }
      };
    }

    // --- ФИНАЛ: Салют и Сердечко ---
    function startConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#fb7185', '#fda4af', '#f43f5e', '#e11d48', '#ffffff', '#fbbf24'];

      for (let i = 0; i < 110; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: Math.random() * 6 + 4,
          d: Math.random() * 90 + 10,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngleIncremental: (Math.random() * 0.07) + 0.05,
          tiltAngle: 0
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, index) => {
          ctx.beginPath();
          ctx.lineWidth = p.r / 2;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + (p.r / 4), p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 4));
          ctx.stroke();

          p.tiltAngle += p.tiltAngleIncremental;
          p.y += (Math.cos(p.d) + 3 + p.r / 2) / 1.4;
          p.tilt = Math.sin(p.tiltAngle - (index / 3)) * 15;

          if (p.y > canvas.height) {
            p.x = Math.random() * canvas.width;
            p.y = -20;
          }
        });
        requestAnimationFrame(draw);
      }
      draw();
    }

    function finishSuccess() {
      resetTimer();
      hideHint();
      startConfetti();

      document.getElementById("step-tag").innerText = "Люблю тебя! ✨";
      document.getElementById("img-box").style.display = "none";
      document.getElementById("text-container").innerText = "Я тебя обожаю!!!";

      document.getElementById("controls-container").innerHTML = `
        <div class="big-heart">❤️</div>
        <button class="btn btn-accent" onclick="location.reload()">Пройти снова</button>
      `;
    }

    // Запуск квеста
    step1();
  </script>
